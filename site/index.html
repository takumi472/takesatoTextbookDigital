<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>春日部日本語教室 デジタルテキストブック</title>
  <meta name="description" content="春日部日本語教室作成の日本語教材（ひらがな・カタカナ・会話・漢字・読み物）をブラウザでそのまま学べるインタラクティブHTMLデジタルテキストサイトです。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="bookshelf-view" class="view">
    <header class="site-header">
      <div class="container header-inner">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">あ</div>
          <div class="brand-text">
            <h1>春日部日本語教室 <span class="accent">デジタルテキスト</span></h1>
            <p class="subtitle">ひらがな・カタカナ・会話・漢字・読み物 全13冊を音声＆練習付きで学習</p>
          </div>
        </div>
        <div class="header-actions">
          <div id="site-stats" class="stats-pill" aria-live="polite">読み込み中...</div>
        </div>
      </div>
    </header>

    <main class="container main-content">
      <!-- Continue Reading Banner -->
      <section id="continue-section" class="continue-section hidden" aria-label="つづきから読む">
        <div class="continue-card">
          <div class="continue-thumb-wrap">
            <img id="continue-thumb" alt="" />
          </div>
          <div class="continue-info">
            <span class="continue-label">つづきから学ぶ</span>
            <h2 id="continue-title"></h2>
            <p id="continue-meta"></p>
          </div>
          <a id="continue-btn" class="btn btn-primary" href="#">
            このページを開く
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="9 18 15 12 9 6"/></svg>
          </a>
        </div>
      </section>

      <!-- Filter & Search Controls -->
      <section class="controls-bar" aria-label="テキストの絞り込みと検索">
        <div class="category-tabs" role="tablist" aria-label="カテゴリ">
          <button class="tab-btn active" role="tab" aria-selected="true" data-category="all">すべて</button>
          <button class="tab-btn" role="tab" aria-selected="false" data-category="kana">かな</button>
          <button class="tab-btn" role="tab" aria-selected="false" data-category="conversation">かいわ・しおり</button>
          <button class="tab-btn" role="tab" aria-selected="false" data-category="kanji">かんじ</button>
          <button class="tab-btn" role="tab" aria-selected="false" data-category="reading">よみもの</button>
        </div>
        <div class="search-box">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="search-input" type="search" placeholder="タイトル・キーワードで検索..." aria-label="テキストを検索" />
        </div>
      </section>

      <!-- Books Grid -->
      <section id="books-grid" class="books-grid" aria-label="テキスト一覧"></section>

      <div id="empty-state" class="empty-state hidden">
        <p>該当するテキストが見つかりませんでした。</p>
        <button id="reset-filter-btn" class="btn btn-outline" type="button">絞り込みをリセット</button>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>春日部日本語教室 デジタルテキストブック（HTML版）</p>
      </div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
